# T0086 — Automated security regression gate (integrates T0121 scan suite)
name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Tests, build, lint, repo scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # Middleware unit tests import db/client, which requires DATABASE_URL at load time.
      # No Postgres is started; Pool is lazy until a query. Dummy URL is enough for import.
      - name: Unit tests (includes sanitizer / SSRF helpers)
        env:
          DATABASE_URL: postgres://taskmesh:taskmesh@127.0.0.1:5432/taskmesh
        run: npm test

      - name: API TypeScript build
        run: npm run build

      - name: Client production build (tsc + Vite)
        run: npm run build --prefix client

      - name: Client ESLint (hard gate, max-warnings 0)
        run: npm run lint --prefix client

      - name: Repo static security scan (hard gate)
        run: npm run security:scan -- --modules repo_static --fail-on-findings --no-html

      - name: npm audit via security scan (hard gate)
        run: npm run security:scan -- --modules repo_npm_audit --fail-on-findings --no-html
