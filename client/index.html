<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskMesh</title>
    <script>
      window.EXCALIDRAW_ASSET_PATH = "/excalidraw-assets/";
      try {
        var ok = { green: 1, blue: 1, orange: 1, yellow: 1, purple: 1, red: 1 };
        var t = localStorage.getItem("taskmesh.theme");
        var separate = localStorage.getItem("taskmesh.separateProjectThemes") === "1";
        if (separate) {
          try {
            var sticky = JSON.parse(localStorage.getItem("taskmesh.stickyProjectTheme") || "null");
            if (sticky && ok[sticky.theme]) t = sticky.theme;
          } catch (e2) {
            /* ignore sticky parse */
          }
        }
        var devDefault = location.port === "5173" ? "yellow" : "green";
        document.documentElement.dataset.theme = ok[t] ? t : devDefault;
      } catch (e) {
        document.documentElement.dataset.theme = location.port === "5173" ? "yellow" : "green";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
