# Compose stack for a self-contained TaskMesh install (app + PostgreSQL + TLS proxy).
# See INSTALL.md → Container install.
#
# Quick start (after installing Docker / Compose on your OS):
#   cp .env.docker.example .env.docker
#   # edit POSTGRES_PASSWORD (and optional OPENAI_API_KEY)
#   bash docker/nginx/generate-certs.sh
#   docker compose --env-file .env.docker up -d --build
#   curl -skS https://127.0.0.1/api/health
#
# HTTP-only loopback lab (explicit opt-in; weaker posture):
#   docker compose -f compose.yaml -f compose.http-lab.yaml --env-file .env.docker up -d --build

name: taskmesh

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: taskmesh
    volumes:
      - taskmesh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmesh -d taskmesh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not published on the host by default — reach via `proxy` (HTTPS).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://taskmesh:${POSTGRES_PASSWORD}@db:5432/taskmesh
      # Secure path: TLS terminator in front; Secure cookies + trust one proxy hop.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
      BACKUP_SCHEDULE_PATH: /app/data/backup-schedule.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASSISTANT_DEFAULT_PROVIDER: ${ASSISTANT_DEFAULT_PROVIDER:-openai}
      ASSISTANT_DEFAULT_MODEL: ${ASSISTANT_DEFAULT_MODEL:-gpt-4.1-mini}
    volumes:
      - taskmesh_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: unless-stopped
    ports:
      - "${TASKMESH_HTTP_PORT:-80}:80"
      - "${TASKMESH_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/ssl/taskmesh:ro
    depends_on:
      - app

volumes:
  taskmesh_pg:
  taskmesh_data:
