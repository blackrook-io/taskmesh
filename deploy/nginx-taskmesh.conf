# TaskMesh — nginx reverse proxy (HTTP :80 → Express on 127.0.0.1:3000)
#
# Install:
#   sudo apt-get install -y nginx
#   sudo cp /srv/taskmesh/deploy/nginx-taskmesh.conf /etc/nginx/sites-available/taskmesh
#   sudo ln -sf /etc/nginx/sites-available/taskmesh /etc/nginx/sites-enabled/taskmesh
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# See INSTALL.md § nginx.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 10m;

  # SSE / long assistant tool loops — do not buffer; allow longer upstream waits
  location /api/v1/assistant/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
