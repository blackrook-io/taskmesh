# TaskMesh nginx vhost — one site on a shared nginx.
#
# Rendered by deploy/install-ubuntu.sh, which replaces:
#   __TASKMESH_FQDN__
#   __TASKMESH_SSL_CERTIFICATE__
#   __TASKMESH_SSL_CERTIFICATE_KEY__
#
# This file is not a catch-all: no default_server, and server_name is the
# TaskMesh FQDN only. Other files in sites-enabled stay in place.
# Do not copy this template into sites-enabled until those tokens are replaced.
#
# Express stays on 127.0.0.1:3000. Browsers use https://__TASKMESH_FQDN__/

server {
  listen 80;
  listen [::]:80;
  server_name __TASKMESH_FQDN__;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name __TASKMESH_FQDN__;

  ssl_certificate     __TASKMESH_SSL_CERTIFICATE__;
  ssl_certificate_key __TASKMESH_SSL_CERTIFICATE_KEY__;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Scoped to this hostname. includeSubDomains applies to names under this FQDN.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  client_max_body_size 10m;

  # SSE / long assistant tool loops — do not buffer; allow longer upstream waits
  location /api/v1/assistant/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
